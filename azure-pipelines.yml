# ASP.NET
# Build and test ASP.NET projects.
# Add steps that publish symbols, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/apps/aspnet/build-aspnet-4



trigger:
- master

pool:
  vmImage: 'windows-latest'

variables:
  RG_Name: RG1
  webappname: 'webapp00089'
  serviceConnection: 'azure'
  solution: '**/*.sln'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'


stages:

# ==========================================
# BUILD
# ==========================================
- stage: Build
  displayName: Build

  jobs:
  - job: Build
    displayName: Build Application

    steps:
    - task: NuGetToolInstaller@1

    - task: NuGetCommand@2
      inputs:
        restoreSolution: '$(solution)'

    - task: VSBuild@1
      inputs:
        solution: '$(solution)'
        msbuildArgs: '/p:DeployOnBuild=true /p:WebPublishMethod=Package /p:PackageAsSingleFile=true /p:SkipInvalidConfigurations=true /p:PackageLocation="$(build.artifactStagingDirectory)"'
        platform: '$(buildPlatform)'
        configuration: '$(buildConfiguration)'

    - task: VSTest@2
      inputs:
        platform: '$(buildPlatform)'
        configuration: '$(buildConfiguration)'
    
    - task: CopyFiles@2
      inputs:
        SourceFolder: '''$(System.DefaultWorkingDirectory)'''
        Contents: 'scriptfortablecreation.sql'
        TargetFolder: '''$(Build.ArtifactStagingDirectory)'''

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'


# ==========================================
# TEST SLOT DEPLOYMENT
# ==========================================
- stage: DeployTest
  displayName: Deploy Test
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployTest
    displayName: Deploy to Test Slot
    environment: Test

    strategy:
      runOnce:
        deploy:
          steps:
          - task: DownloadBuildArtifacts@1
            inputs:
              buildType: 'current'
              downloadType: 'single'
              artifactName: 'drop'
              downloadPath: '$(System.DefaultWorkingDirectory)'



          - task: SqlAzureDacpacDeployment@1
            inputs:
              azureSubscription: 'azure'
              AuthenticationType: 'server'
              ServerName: 'serverdb00089.database.windows.net'
              DatabaseName: 'db00089'
              SqlUsername: 'sreenija'
              SqlPassword: '$(SqlPassword)'
              deployType: 'SqlTask'
              SqlFile: '$(System.DefaultWorkingDirectory)/drop/scriptfortablecreation.sql'


              

          - task: AzureRmWebAppDeployment@5
            inputs:
              ConnectionType: 'AzureRM'
              azureSubscription: '$(serviceConnection)'
              appType: 'webApp'
              WebAppName: '$(webappname)'
              deployToSlotOrASE: true
              ResourceGroupName: '$(RG_Name)'
              SlotName: 'test'
              packageForLinux: '$(System.DefaultWorkingDirectory)\drop\sqlapp.zip'
              AppSettings: |
                [
                {
                "name": "SQLConnection",
                "value": "Server=tcp:serverdb00089.database.windows.net,1433;Initial Catalog=db00089;Persist Security Info=False;User ID=sreenija;Password=Nija1234;MultipleActiveResultSets=False;Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;",
                "type": "SQLAzure",
                "slotSetting": false
                }
                ]

  # Prod SLOT DEPLOYMENT
# ==========================================
- stage: DeployProd
  displayName: Deploy Prod
  dependsOn: DeployTest
  condition: succeeded()
  jobs:
  - deployment: DeployProd
    displayName: Deploy to Prod Slot
    environment: Prod

    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureAppServiceManage@0
            inputs:
              azureSubscription: '$(serviceConnection)'
              Action: 'Swap Slots'
              WebAppName: '$(webappname)'
              ResourceGroupName: '$(RG_Name)'
              SourceSlot: 'test'
