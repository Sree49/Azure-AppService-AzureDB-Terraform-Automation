# ASP.NET
# Build and test ASP.NET projects.
# Add steps that publish symbols, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/apps/aspnet/build-aspnet-4



trigger:
- master

pool:
  vmImage: 'windows-latest'

variables:
- group: variablegroup

  


stages:

# ==========================================
# BUILD
# ==========================================

- stage: Provision
  displayName: Provision
  jobs:
    - job: Provision
      displayName: Provision Appservice and DB
      steps: 
        - task: TerraformInstaller@1
          inputs:
            terraformVersion: '1.9.8'

        - task: AzureCLI@2
          inputs:
            azureSubscription: '$(serviceConnection)'
            workingDirectory: '$(System.DefaultWorkingDirectory)/infrastructure'
            scriptType: 'bash'
            scriptLocation: 'inlineScript'
            addSpnToEnvironment: true
            inlineScript: |
              export ARM_CLIENT_ID=$servicePrincipalId
              export ARM_CLIENT_SECRET=$servicePrincipalKey
              export ARM_TENANT_ID=$tenantId
              export ARM_SUBSCRIPTION_ID=$subid
              terraform init
              terraform plan
              terraform apply -auto-approve
              



- stage: Build
  displayName: Build
  dependsOn: Provision
  condition: succeeded()
  jobs:
  - job: Build
    displayName: Build Application

    steps:
    - task: NuGetToolInstaller@1

    - task: NuGetCommand@2
      inputs:
        restoreSolution: '$(solution)'

    - task: VSBuild@1
      inputs:
        solution: '$(solution)'
        msbuildArgs: '/p:DeployOnBuild=true /p:WebPublishMethod=Package /p:PackageAsSingleFile=true /p:SkipInvalidConfigurations=true /p:PackageLocation="$(build.artifactStagingDirectory)"'
        platform: '$(buildPlatform)'
        configuration: '$(buildConfiguration)'

    - task: VSTest@2
      inputs:
        platform: '$(buildPlatform)'
        configuration: '$(buildConfiguration)'
    
    - task: CopyFiles@2
      inputs:
        SourceFolder: '$(System.DefaultWorkingDirectory)'
        Contents: 'scriptfortablecreation.sql'
        TargetFolder: '$(Build.ArtifactStagingDirectory)'

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'


# ==========================================
# TEST SLOT DEPLOYMENT
# ==========================================
- stage: DeployTest
  displayName: Deploy Test
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployTest
    displayName: Deploy to Test Slot
    environment: Test

    strategy:
      runOnce:
        deploy:
          steps:
          - task: DownloadBuildArtifacts@1
            inputs:
              buildType: 'current'
              downloadType: 'single'
              artifactName: 'drop'
              downloadPath: '$(System.DefaultWorkingDirectory)'



          - task: SqlAzureDacpacDeployment@1
            inputs:
              azureSubscription: '$(serviceConnection)'
              AuthenticationType: 'server'
              ServerName: '$(servername).database.windows.net'
              DatabaseName: '$(dbname)'
              SqlUsername: '$(dbusername)'
              SqlPassword: '$(SqlPassword)'
              deployType: 'SqlTask'
              SqlFile: '$(System.DefaultWorkingDirectory)/drop/scriptfortablecreation.sql'


          - task: AzureAppServiceSettings@1
            inputs:
              azureSubscription: '$(serviceConnection)'
              appName: '$(webappname)'
              resourceGroupName: '$(RG_Name)'
              connectionStrings: |
                [
                  {
                    "name": "SQLConnection",
                    "value": "Server=tcp:$(servername).database.windows.net,1433;Initial Catalog=$(dbname);Persist Security Info=False;User ID=$(dbusername);Password=$(SqlPassword);MultipleActiveResultSets=False;Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;",
                    "type": "SQLAzure"
                  }
                ]    

          - task: AzureRmWebAppDeployment@5
            inputs:
              ConnectionType: 'AzureRM'
              azureSubscription: '$(serviceConnection)'
              appType: 'webApp'
              WebAppName: '$(webappname)'
              deployToSlotOrASE: true
              ResourceGroupName: '$(RG_Name)'
              SlotName: 'test'
              packageForLinux: '$(System.DefaultWorkingDirectory)\drop\**\*.zip'
         
  # Prod SLOT DEPLOYMENT
# ==========================================
- stage: DeployProd
  displayName: Deploy Prod
  dependsOn: DeployTest
  condition: succeeded()
  jobs:
  - deployment: DeployProd
    displayName: Deploy to Prod Slot
    environment: Prod

    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureAppServiceManage@0
            inputs:
              azureSubscription: '$(serviceConnection)'
              Action: 'Swap Slots'
              WebAppName: '$(webappname)'
              ResourceGroupName: '$(RG_Name)'
              SourceSlot: 'test'
